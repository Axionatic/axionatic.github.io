<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Mark Dingwall - Magnetites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/sketch.css">
  <link rel="stylesheet" href="../../css/nav-buttons.css">
  <style>
    html, body { background: #000; }
    #drawHere { height: auto; }
    canvas { display: block; }
    #instructions { font-family: 'Overpass', sans-serif; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm"
    }
  }
  </script>
</head>
<body>
  <nav class="nav-btn nav-btn--pill" aria-label="Navigation">
    <a class="nav-btn__link" href="/" aria-label="Home">
      <svg class="nav-btn__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/><path d="M9 21V14h6v7"/>
      </svg>
    </a>
    <a class="nav-btn__link" href="../" aria-label="Back">
      <svg class="nav-btn__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
  </nav>
  <div id="instructions">Drag to rotate. Scroll to zoom. Keys 1-4: switch modes. S: symmetry view.</div>
  <div id="hud" style="
    position: fixed;
    bottom: 10px;
    left: 10px;
    color: white;
    font-family: sans-serif;
    font-size: 14px;
    pointer-events: none;
    z-index: 10;
  "></div>
  <script type="module" src="main.js"></script>
  <script src="../../marquee.js"></script>
</body>
</html>
